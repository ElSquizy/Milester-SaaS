name: Backup diario

# Corre scripts/backup.mjs (datos propios de la app: Settings, plantillas,
# campañas, agenda, mapas id→tiendaNubeId) y guarda el backup CIFRADO como
# artefacto de GitHub (90 días de retención). El espejo comercial de TN no se
# respalda: se reconstruye con el pull.
#
# Requiere 3 secrets del repo (Settings → Secrets and variables → Actions):
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN  → acceso de solo lectura a la base
#   BACKUP_PASSPHRASE                     → frase para cifrar/descifrar el backup
#
# Descifrar un backup descargado:
#   openssl enc -d -aes-256-cbc -pbkdf2 -in backup-<fecha>.json.enc \
#     -out backup.json -pass pass:'<tu BACKUP_PASSPHRASE>'

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 03:00 AR, todos los días
  workflow_dispatch: {}    # permite lanzarlo a mano desde la pestaña Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Generar backup
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/backup.mjs

      - name: Cifrar y borrar el plano (contiene credenciales)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          shopt -s nullglob
          for f in backups/*.json; do
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$f" -out "$f.enc" -pass env:BACKUP_PASSPHRASE
            rm "$f"
          done

      - name: Subir backup cifrado
        uses: actions/upload-artifact@v4
        with:
          name: milester-backup-${{ github.run_id }}
          path: backups/*.enc
          retention-days: 90
          if-no-files-found: error
